<!DOCTYPE html>
<html lang="es">
{% include header.html %}
<body id="top">
<!-- CABECERA -->
{% include cabecera.html %}
<!-- MENU -->
{% include menu.html %}

{{ content }}

<p class="fecha-articulo">
  Última actualización:
  {{ page.date | date: "%-d de %B de %Y" }}
</p>
  
<!-- FOOTER -->
{% include footer.html %}

<a id="backtotop" href="#top"><i class="fa fa-chevron-up"></i></a>

<script src="{{ '/layout/scripts/funciones.js' | relative_url }}"></script>

<script>
  function llamaReady(){
    functionReady();
  }
  $(document).ready(function(){
    llamaReady();
  });

  $("#mostrar").click(function(){
    $("#sabermas").toggle(300);
  });

  $("#mostrarmasmas").click(function(){
    $("#sabermasmas").toggle(300);
  });
</script>
